services:
  akte-zimmerwald-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: akte-zimmerwald-web:latest
    container_name: akte-zimmerwald-web
    restart: unless-stopped
    ports:
      - "4680:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
