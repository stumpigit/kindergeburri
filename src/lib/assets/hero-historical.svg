<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f4e8"/>
  
  <!-- Paper texture effect -->
  <path d="M0 0 L800 0 L800 400 L0 400 Z" fill="url(#texture)" opacity="0.1"/>
  
  <!-- Historical school building -->
  <g transform="translate(150, 150)">
    <!-- Building base -->
    <rect x="0" y="0" width="300" height="200" fill="#e0d6c0" stroke="#c4b89a" stroke-width="2"/>
    
    <!-- Windows -->
    <rect x="20" y="20" width="40" height="60" fill="#f0e8d0" stroke="#c4b89a" stroke-width="1"/>
    <rect x="70" y="20" width="40" height="60" fill="#f0e8d0" stroke="#c4b89a" stroke-width="1"/>
    <rect x="120" y="20" width="40" height="60" fill="#f0e8d0" stroke="#c4b89a" stroke-width="1"/>
    <rect x="170" y="20" width="40" height="60" fill="#f0e8d0" stroke="#c4b89a" stroke-width="1"/>
    <rect x="220" y="20" width="40" height="60" fill="#f0e8d0" stroke="#c4b89a" stroke-width="1"/>
    
    <!-- Door -->
    <rect x="130" y="100" width="40" height="80" fill="#d4c8b0" stroke="#c4b89a" stroke-width="1"/>
    
    <!-- Roof -->
    <polygon points="0,-20 300,-20 280,0 20,0" fill="#8b4513" stroke="#5d2d0a" stroke-width="2"/>
    
    <!-- Chimney -->
    <rect x="250" y="-40" width="20" height="40" fill="#5d2d0a" stroke="#3a1a07" stroke-width="1"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="80" font-family="Cormorant Garamond, serif" font-size="48" fill="#1c1812" text-anchor="middle">Kindergeburtstag</text>
  <text x="400" y="120" font-family="Cormorant Garamond, serif" font-size="24" fill="#1c1812" text-anchor="middle">Fall Zimmerwald</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="10" fill="#8b4513" opacity="0.3"/>
  <circle cx="700" cy="300" r="15" fill="#8b4513" opacity="0.3"/>
  
  <!-- Texture definition -->
  <defs>
    <pattern id="texture" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M0 0 L20 20 M20 0 L0 20" stroke="#c4b89a" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
</svg>