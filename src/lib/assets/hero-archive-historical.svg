<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f4e8"/>
  
  <!-- Paper texture effect -->
  <path d="M0 0 L800 0 L800 400 L0 400 Z" fill="url(#texture)" opacity="0.1"/>
  
  <!-- Archive shelf -->
  <g transform="translate(100, 150)">
    <!-- Shelf base -->
    <rect x="0" y="0" width="600" height="20" fill="#8b4513" stroke="#5d2d0a" stroke-width="2"/>
    
    <!-- Shelf planks -->
    <g fill="#d4c8b0" stroke="#c4b89a" stroke-width="1">
      <rect x="0" y="-20" width="100" height="20"/>
      <rect x="120" y="-20" width="100" height="20"/>
      <rect x="240" y="-20" width="100" height="20"/>
      <rect x="360" y="-20" width="100" height="20"/>
      <rect x="480" y="-20" width="100" height="20"/>
    </g>
    
    <!-- Books -->
    <g>
      <rect x="10" y="-40" width="10" height="40" fill="#8b4513"/>
      <rect x="25" y="-40" width="10" height="40" fill="#5d2d0a"/>
      <rect x="40" y="-40" width="10" height="40" fill="#8b4513"/>
      <rect x="55" y="-40" width="10" height="40" fill="#5d2d0a"/>
      <rect x="70" y="-40" width="10" height="40" fill="#8b4513"/>
      
      <rect x="130" y="-40" width="10" height="40" fill="#5d2d0a"/>
      <rect x="145" y="-40" width="10" height="40" fill="#8b4513"/>
      <rect x="160" y="-40" width="10" height="40" fill="#5d2d0a"/>
      <rect x="175" y="-40" width="10" height="40" fill="#8b4513"/>
      <rect x="190" y="-40" width="10" height="40" fill="#5d2d0a"/>
      
      <rect x="250" y="-40" width="10" height="40" fill="#8b4513"/>
      <rect x="265" y="-40" width="10" height="40" fill="#5d2d0a"/>
      <rect x="280" y="-40" width="10" height="40" fill="#8b4513"/>
      <rect x="295" y="-40" width="10" height="40" fill="#5d2d0a"/>
      <rect x="310" y="-40" width="10" height="40" fill="#8b4513"/>
      
      <rect x="370" y="-40" width="10" height="40" fill="#5d2d0a"/>
      <rect x="385" y="-40" width="10" height="40" fill="#8b4513"/>
      <rect x="400" y="-40" width="10" height="40" fill="#5d2d0a"/>
      <rect x="415" y="-40" width="10" height="40" fill="#8b4513"/>
      <rect x="430" y="-40" width="10" height="40" fill="#5d2d0a"/>
      
      <rect x="490" y="-40" width="10" height="40" fill="#8b4513"/>
      <rect x="505" y="-40" width="10" height="40" fill="#5d2d0a"/>
      <rect x="520" y="-40" width="10" height="40" fill="#8b4513"/>
      <rect x="535" y="-40" width="10" height="40" fill="#5d2d0a"/>
      <rect x="550" y="-40" width="10" height="40" fill="#8b4513"/>
    </g>
    
    <!-- Documents -->
    <g>
      <rect x="120" y="-80" width="60" height="80" fill="#f0e8d0" stroke="#c4b89a" stroke-width="1"/>
      <rect x="180" y="-80" width="60" height="80" fill="#f0e8d0" stroke="#c4b89a" stroke-width="1"/>
      <rect x="240" y="-80" width="60" height="80" fill="#f0e8d0" stroke="#c4b89a" stroke-width="1"/>
      <rect x="300" y="-80" width="60" height="80" fill="#f0e8d0" stroke="#c4b89a" stroke-width="1"/>
      <rect x="360" y="-80" width="60" height="80" fill="#f0e8d0" stroke="#c4b89a" stroke-width="1"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="400" y="80" font-family="Cormorant Garamond, serif" font-size="48" fill="#1c1812" text-anchor="middle">Fall Zimmerwald</text>
  <text x="400" y="120" font-family="Cormorant Garamond, serif" font-size="24" fill="#1c1812" text-anchor="middle">Archiv</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="10" fill="#8b4513" opacity="0.3"/>
  <circle cx="700" cy="300" r="15" fill="#8b4513" opacity="0.3"/>
  
  <!-- Texture definition -->
  <defs>
    <pattern id="texture" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M0 0 L20 20 M20 0 L0 20" stroke="#c4b89a" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
</svg>